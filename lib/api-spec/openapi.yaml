components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - createdAt

    NewsArticle:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        titleTa:
          type: ["string", "null"]
        content:
          type: string
        contentTa:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        category:
          type: string
        featured:
          type: boolean
        publishedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - category
        - featured
        - createdAt

    NewsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required:
        - items
        - total
        - page
        - totalPages

    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        titleTa:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        descriptionTa:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        venue:
          type: string
        eventDate:
          type: string
          format: date-time
        endDate:
          type: ["string", "null"]
          format: date-time
        category:
