openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Nirmal Connect API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: news
    description: News and announcements
  - name: events
    description: Events and campaigns
  - name: activities
    description: Daily activities
  - name: gallery
    description: Media gallery
  - name: volunteers
    description: Volunteer management
  - name: faqs
    description: Frequently asked questions
  - name: stats
    description: Constituency statistics and analytics
  - name: grievances
    description: Grievance management
  - name: admin
    description: Admin CMS — staff-only routes (requires Bearer token + staff role)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: List news articles
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: featured
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of news articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsListResponse"

  /news/{id}:
    get:
      operationId: getNewsArticle
      tags: [news]
      summary: Get a news article by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: News article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: upcoming
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List daily activities
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityListResponse"

  /gallery:
    get:
      operationId: listGallery
      tags: [gallery]
      summary: List gallery media items
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          schema:
            type: string
            enum: [photo, video]
        - name: album
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Gallery items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryListResponse"

  /volunteers:
    post:
      operationId: registerVolunteer
      tags: [volunteers]
      summary: Register as a volunteer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerRegistrationBody"
      responses:
        "201":
          description: Volunteer registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volunteer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /faqs:
    get:
      operationId: listFaqs
      tags: [faqs]
      summary: List FAQs
      responses:
        "200":
          description: List of FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faq"

  /about:
    get:
      operationId: getAboutConfig
      tags: [stats]
      summary: Get public About-the-leader CMS content
      description: Returns the parsed JSON value of the site_config "about" key, or null if no CMS content has been saved yet.
      responses:
        "200":
          description: About config (object) or null when not yet configured
          content:
            application/json:
              schema:
                nullable: true
                type: object
                additionalProperties: true

  /stats/constituency:
    get:
      operationId: getConstituencyStats
      tags: [stats]
      summary: Get constituency development statistics
      responses:
        "200":
          description: Constituency statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstituencyStats"

  /stats/summary:
    get:
      operationId: getSiteSummary
      tags: [stats]
      summary: Get site-wide summary counts for homepage
      responses:
        "200":
          description: Site summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSummary"

  /news/featured/latest:
    get:
      operationId: getFeaturedNews
      tags: [news]
      summary: Get featured/latest news for homepage ticker
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Featured news items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsArticle"

  /events/upcoming/list:
    get:
      operationId: getUpcomingEvents
      tags: [events]
      summary: Get upcoming events for homepage
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /activities/recent:
    get:
      operationId: getRecentActivities
      tags: [activities]
      summary: Get recent activities for homepage ticker
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Recent activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

  /grievances/submit:
    post:
      operationId: submitGrievance
      tags: [grievances]
      summary: Submit a public grievance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrievanceSubmitBody"
      responses:
        "201":
          description: Grievance submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievancePublic"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/track/{ticketNo}:
    get:
      operationId: trackGrievance
      tags: [grievances]
      summary: Track a grievance by ticket number (public)
      parameters:
        - name: ticketNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Grievance detail with timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievanceTrackResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/heatmap:
    get:
      operationId: getGrievanceHeatmap
      tags: [grievances]
      summary: Get public grievance category heatmap data
      responses:
        "200":
          description: Category and area distribution counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievanceHeatmap"

  /grievances:
    get:
      operationId: listGrievances
      tags: [grievances]
      summary: List grievances (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: ward
          in: query
          schema:
            type: string
        - name: constituency
          in: query
          schema:
            type: string
        - name: mine
          in: query
          description: When "1", limit to grievances assigned to the calling officer.
          schema:
            type: string
        - name: assignedTo
          in: query
          description: User id of the assignee, or the literal string "unassigned".
          schema:
            type: string
      responses:
        "200":
          description: Paginated grievance list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievanceListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/officers:
    get:
      operationId: listGrievanceOfficers
      tags: [grievances]
      summary: List staff users available for grievance assignment (staff only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of staff officers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievanceOfficerList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/{id}:
    get:
      operationId: getGrievanceDetail
      tags: [grievances]
      summary: Get full grievance detail with all remarks and attachments (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full grievance detail with internal remarks and attachments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievanceStaffDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Grievance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/{id}/priority:
    patch:
      operationId: updateGrievancePriority
      tags: [grievances]
      summary: Update grievance priority (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrievancePriorityUpdateBody"
      responses:
        "200":
          description: Priority updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievancePublic"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/{id}/status:
    patch:
      operationId: updateGrievanceStatus
      tags: [grievances]
      summary: Update grievance status (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrievanceStatusUpdateBody"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievancePublic"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/{id}/remarks:
    post:
      operationId: addGrievanceRemark
      tags: [grievances]
      summary: Add a remark to a grievance (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrievanceRemarkBody"
      responses:
        "201":
          description: Remark added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievanceRemark"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/{id}/assign:
    post:
      operationId: assignGrievance
      tags: [grievances]
      summary: Assign grievance to an officer (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrievanceAssignBody"
      responses:
        "200":
          description: Grievance assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievancePublic"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wards:
    get:
      operationId: listPublicWards
      tags: [stats]
      summary: List wards/areas (public, summary only)
      description: Public list of wards used to populate ward dropdowns on the Grievance and Volunteer forms. Coordinator contact details are not exposed.
      responses:
        "200":
          description: Ward list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WardSummary"

  /zones:
    get:
      operationId: listPublicZones
      tags: [stats]
      summary: List Madurai Corporation zones (public)
      responses:
        "200":
          description: Zone list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }

  /zones/{id}/wards:
    get:
      operationId: listPublicWardsByZone
      tags: [stats]
      summary: List wards inside a zone (public)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ward list for the given zone
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WardSummary" }

  /wards/{id}/areas:
    get:
      operationId: listPublicAreasByWard
      tags: [stats]
      summary: List sub-areas inside a ward (public)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Area list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Area" }

  /wards/{id}/polling-stations:
    get:
      operationId: listPublicPollingStationsByWard
      tags: [stats]
      summary: List polling stations (booths) inside a ward (public)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Polling-station list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PollingStation" }

  /polling-stations:
    get:
      operationId: listPublicPollingStations
      tags: [stats]
      summary: List all polling stations (booths) in the constituency (public)
      responses:
        "200":
          description: Polling-station list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PollingStation" }

  /pincodes:
    get:
      operationId: listPublicPincodes
      tags: [stats]
      summary: List pincodes covering the constituency (public)
      responses:
        "200":
          description: Pincode list with linked ward IDs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PincodePublic" }

  /admin/wards:
    get:
      operationId: adminListWards
      tags: [admin]
      summary: List all wards/areas
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ward list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ward"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: adminCreateWard
      tags: [admin]
      summary: Create a ward/area
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WardBody"
      responses:
        "201":
          description: Ward created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ward"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/wards/{id}:
    put:
      operationId: adminUpdateWard
      tags: [admin]
      summary: Update a ward/area
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WardBody"
      responses:
        "200":
          description: Ward updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ward"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteWard
      tags: [admin]
      summary: Delete a ward/area
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/hierarchy/tree:
    get:
      operationId: adminGetHierarchyTree
      tags: [admin]
      summary: Get the full Zone→Ward→Area→Street tree (with booth counts)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hierarchy tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HierarchyTree"
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/hierarchy/wards/{id}/polling-stations:
    get:
      operationId: adminGetWardBooths
      tags: [admin]
      summary: List polling stations (booths) for a ward
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Booth list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HierarchyBooth" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/hierarchy/zones:
    post:
      operationId: adminCreateZone
      tags: [admin]
      summary: Create a zone
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HierarchyZoneBody" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/HierarchyZone" } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/hierarchy/zones/{id}:
    put:
      operationId: adminUpdateZone
      tags: [admin]
      summary: Update a zone
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HierarchyZoneBody" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/HierarchyZone" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      operationId: adminDeleteZone
      tags: [admin]
      summary: Delete a zone
      security: [{ bearerAuth: [] }]
      parameters:
