openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Nirmal Connect API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: news
    description: News and announcements
  - name: events
    description: Events and campaigns
  - name: activities
    description: Daily activities
  - name: gallery
    description: Media gallery
  - name: volunteers
    description: Volunteer management
  - name: faqs
    description: Frequently asked questions
  - name: stats
    description: Constituency statistics and analytics
  - name: grievances
    description: Grievance management
  - name: admin
    description: Admin CMS — staff-only routes (requires Bearer token + staff role)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: List news articles
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: featured
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of news articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsListResponse"

  /news/{id}:
    get:
      operationId: getNewsArticle
      tags: [news]
      summary: Get a news article by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: News article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: upcoming
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List daily activities
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityListResponse"

  /gallery:
    get:
      operationId: listGallery
      tags: [gallery]
      summary: List gallery media items
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          schema:
            type: string
            enum: [photo, video]
        - name: album
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Gallery items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryListResponse"

  /volunteers:
    post:
      operationId: registerVolunteer
      tags: [volunteers]
      summary: Register as a volunteer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerRegistrationBody"
      responses:
        "201":
          description: Volunteer registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volunteer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /faqs:
    get:
      operationId: listFaqs
      tags: [faqs]
      summary: List FAQs
      responses:
        "200":
          description: List of FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faq"

  /about:
    get:
      operationId: getAboutConfig
      tags: [stats]
      summary: Get public About-the-leader CMS content
      description: Returns the parsed JSON value of the site_config "about" key, or null if no CMS content has been saved yet.
      responses:
        "200":
          description: About config (object) or null when not yet configured
          content:
            application/json:
              schema:
                nullable: true
                type: object
                additionalProperties: true

  /stats/constituency:
    get:
      operationId: getConstituencyStats
      tags: [stats]
      summary: Get constituency development statistics
      responses:
        "200":
          description: Constituency statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstituencyStats"

  /stats/summary:
    get:
      operationId: getSiteSummary
      tags: [stats]
      summary: Get site-wide summary counts for homepage
      responses:
        "200":
          description: Site summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSummary"

  /news/featured/latest:
    get:
      operationId: getFeaturedNews
      tags: [news]
      summary: Get featured/latest news for homepage ticker
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Featured news items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsArticle"

  /events/upcoming/list:
    get:
      operationId: getUpcomingEvents
      tags: [events]
      summary: Get upcoming events for homepage
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /activities/recent:
    get:
      operationId: getRecentActivities
      tags: [activities]
      summary: Get recent activities for homepage ticker
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Recent activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

  /grievances/submit:
    post:
      operationId: submitGrievance
      tags: [grievances]
      summary: Submit a public grievance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrievanceSubmitBody"
      responses:
        "201":
          description: Grievance submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievancePublic"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/track/{ticketNo}:
    get:
      operationId: trackGrievance
      tags: [grievances]
      summary: Track a grievance by ticket number (public)
      parameters:
        - name: ticketNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Grievance detail with timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievanceTrackResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/heatmap:
    get:
      operationId: getGrievanceHeatmap
      tags: [grievances]
      summary: Get public grievance category heatmap data
      responses:
        "200":
          description: Category and area distribution counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievanceHeatmap"

  /grievances:
    get:
      operationId: listGrievances
      tags: [grievances]
      summary: List grievances (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: ward
          in: query
          schema:
            type: string
        - name: constituency
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated grievance list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievanceListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/officers:
    get:
      operationId: listGrievanceOfficers
      tags: [grievances]
      summary: List staff users available for grievance assignment (staff only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of staff officers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievanceOfficerList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/{id}:
    get:
      operationId: getGrievanceDetail
      tags: [grievances]
      summary: Get full grievance detail with all remarks and attachments (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full grievance detail with internal remarks and attachments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievanceStaffDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Grievance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/{id}/priority:
    patch:
      operationId: updateGrievancePriority
      tags: [grievances]
      summary: Update grievance priority (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrievancePriorityUpdateBody"
      responses:
        "200":
          description: Priority updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievancePublic"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/{id}/status:
    patch:
      operationId: updateGrievanceStatus
      tags: [grievances]
      summary: Update grievance status (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrievanceStatusUpdateBody"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievancePublic"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/{id}/remarks:
    post:
      operationId: addGrievanceRemark
      tags: [grievances]
      summary: Add a remark to a grievance (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrievanceRemarkBody"
      responses:
        "201":
          description: Remark added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievanceRemark"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grievances/{id}/assign:
    post:
      operationId: assignGrievance
      tags: [grievances]
      summary: Assign grievance to an officer (staff only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrievanceAssignBody"
      responses:
        "200":
          description: Grievance assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrievancePublic"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/wards:
    get:
      operationId: adminListWards
      tags: [admin]
      summary: List all wards/areas
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ward list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ward"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: adminCreateWard
      tags: [admin]
      summary: Create a ward/area
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WardBody"
      responses:
        "201":
          description: Ward created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ward"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/wards/{id}:
    put:
      operationId: adminUpdateWard
      tags: [admin]
      summary: Update a ward/area
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WardBody"
      responses:
        "200":
          description: Ward updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ward"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteWard
      tags: [admin]
      summary: Delete a ward/area
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/grievances/bulk-assign:
    post:
      operationId: adminBulkAssignGrievances
      tags: [admin]
      summary: Bulk-assign grievances to an officer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkGrievanceAssignBody"
      responses:
        "200":
          description: Number of updated records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - createdAt

    NewsArticle:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        titleTa:
          type: ["string", "null"]
        content:
          type: string
        contentTa:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        category:
          type: string
        featured:
          type: boolean
        publishedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - category
        - featured
        - createdAt

    NewsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required:
        - items
        - total
        - page
        - totalPages

    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        titleTa:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        descriptionTa:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        venue:
          type: string
        eventDate:
          type: string
          format: date-time
        endDate:
          type: ["string", "null"]
          format: date-time
        category:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - venue
        - eventDate
        - category
        - createdAt

    EventListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required:
        - items
        - total
        - page
        - totalPages

    Activity:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        titleTa:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        descriptionTa:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        activityDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        category:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - activityDate
        - category
        - createdAt

    ActivityListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required:
        - items
        - total
        - page
        - totalPages

    GalleryItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        mediaUrl:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        mediaType:
          type: string
          enum: [photo, video]
        album:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - mediaUrl
        - mediaType
        - createdAt

    GalleryListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GalleryItem"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required:
        - items
        - total
        - page
        - totalPages

    VolunteerRegistrationBody:
      type: object
      properties:
        name:
          type: string
        nameTa:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
          format: email
        phone:
          type: string
        ward:
          type: ["string", "null"]
        constituency:
          type: string
        skills:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
      required:
        - name
        - phone
        - constituency

    Volunteer:
      type: object
      properties:
